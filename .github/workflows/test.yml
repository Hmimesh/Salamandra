name: Production core acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-browser-qa:
    name: Windows browser QA lifecycle
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fixture Python dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Browser QA must exit successfully
        timeout-minutes: 10
        run: pnpm qa:browser
      - name: Verify fixture process and port were released
        if: always()
        run: |
          if (Get-NetTCPConnection -LocalPort 4173 -State Listen -ErrorAction SilentlyContinue) {
            throw "Browser QA left port 4173 listening"
          }
          $fixtures = Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^python' -and $_.CommandLine -match 'tests[/\\]e2e_server.py' }
          if ($fixtures) { throw "Browser QA left a fixture process running" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  production-core-acceptance:
    name: PostgreSQL production core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salamandra
          POSTGRES_PASSWORD: salamandra
          POSTGRES_DB: salamandra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salamandra -d salamandra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SALAMANDRA_TEST_POSTGRES_URL: postgresql+psycopg://salamandra:salamandra@127.0.0.1:5432/salamandra_test
      SALAMANDRA_DATABASE_URL: postgresql+psycopg://salamandra:salamandra@127.0.0.1:5432/salamandra_test
      SALAMANDRA_REQUIRE_POSTGRES_TESTS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Verify migration upgrade, downgrade, and stable head
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Run complete production-core acceptance suite
        run: python tests/run_production_core_acceptance.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm run check
      - name: Vite production build
        run: pnpm run build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Reproducible browser QA
        run: pnpm qa:browser
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
