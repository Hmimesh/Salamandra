name: Production core acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  production-core-acceptance:
    name: PostgreSQL production core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salamandra
          POSTGRES_PASSWORD: salamandra
          POSTGRES_DB: salamandra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salamandra -d salamandra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SALAMANDRA_TEST_POSTGRES_URL: postgresql+psycopg://salamandra:salamandra@127.0.0.1:5432/salamandra_test
      SALAMANDRA_DATABASE_URL: postgresql+psycopg://salamandra:salamandra@127.0.0.1:5432/salamandra_test
      SALAMANDRA_REQUIRE_POSTGRES_TESTS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Verify migration upgrade, downgrade, and stable head
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Run complete production-core acceptance suite
        run: python tests/run_production_core_acceptance.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm run check
      - name: Vite production build
        run: pnpm run build
